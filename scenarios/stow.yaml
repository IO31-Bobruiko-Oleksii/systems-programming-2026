name: 'stow: pushbutton on PB5 stows the panel, a second press inside 200 ms is ignored, a later press is accepted (LR3)'
version: 1
steps:
  - wait-serial: 'SELFTEST END total=5 passed=5 failed=0'
  - delay: 6025ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - wait-serial: 'EVT stow t_us='
  - delay: 10ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 36ms
  - write-serial: "track\n"
  - wait-serial: 'CMD track OK az=90 tilt=90 band=100 zero=90,90 parked=0 stowed=1'
  - delay: 40ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 10ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 40ms
  - write-serial: "button\n"
  - wait-serial: 'accepted=1 ignored='
  - delay: 250ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 10ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 40ms
  - write-serial: "button\n"
  - wait-serial: 'accepted=2 ignored='
  - delay: 5ms
