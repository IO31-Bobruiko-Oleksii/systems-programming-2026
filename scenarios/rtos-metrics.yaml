name: 'rtos-metrics: every stack path once (log, SD, selftest, stow, stats print), then tasks, heap, context-switch and tick cost'
version: 1
steps:
  - wait-serial: 'SELFTEST END total=5 passed=5 failed=0'
  - wait-serial: 'RTOS up tick_hz=1000'
  - delay: 100ms
  - write-serial: "log on\n"
  - wait-serial: 'CMD log OK on=1'
  - delay: 1500ms
  - write-serial: "sd write 16000\n"
  - wait-serial: 'CMD sd-write OK block=16000'
  - write-serial: "sd read 16000\n"
  - wait-serial: 'CMD sd-read OK block=16000'
  - write-serial: "log flush\n"
  - wait-serial: 'CMD log-flush OK'
  - write-serial: "selftest\n"
  - wait-serial: 'SELFTEST END total=5 passed=5 failed=0'
  - write-serial: "stats reset\n"
  - wait-serial: 'CMD stats-reset OK'
  - write-serial: "load 5000 1000\n"
  - wait-serial: 'CMD load OK us=5000 ms=1000'
  - wait-serial: 'EVT load done us=5000 ms='
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - wait-serial: 'EVT stow t_us='
  - delay: 10ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 100ms
  - write-serial: "tasks\n"
  - wait-serial: 'CMD tasks OK count=6'
  - write-serial: "heap\n"
  - wait-serial: 'CMD heap OK total='
  - write-serial: "ctx\n"
  - wait-serial: 'CMD ctx OK rounds=200'
  - wait-serial: 'STAT os tick_isr n='
  - delay: 50ms