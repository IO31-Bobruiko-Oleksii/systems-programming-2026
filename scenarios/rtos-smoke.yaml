name: 'rtos-smoke: the application runs as tasks; tasks and heap commands, the stow button, a load window'
version: 1
steps:
  - wait-serial: 'SELFTEST END total=5 passed=5 failed=0'
  - wait-serial: 'RTOS up tick_hz=1000'
  - delay: 300ms
  - write-serial: "track\n"
  - wait-serial: 'CMD track OK az='
  - write-serial: "tasks\n"
  - wait-serial: 'STAT task name=track prio=4'
  - wait-serial: 'STAT os tick_hz=1000'
  - wait-serial: 'CMD tasks OK count=6'
  - write-serial: "heap\n"
  - wait-serial: 'CMD heap OK total='
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - wait-serial: 'EVT stow t_us='
  - delay: 10ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 100ms
  - write-serial: "load 5000 300\n"
  - wait-serial: 'CMD load OK us=5000 ms=300'
  - wait-serial: 'EVT load done us=5000 ms='
  - delay: 50ms
  - write-serial: "stats\n"
  - wait-serial: 'CMD stats OK'
  - write-serial: "tasks\n"
  - wait-serial: 'CMD tasks OK count=6'
