name: 'calibrate: dead zone and zero position set over UART, the same light inside and outside the dead zone, night park at the new zero (LR3, FR-04, FR-06, FR-07)'
version: 1
steps:
  - wait-serial: 'SELFTEST END total=5 passed=5 failed=0'
  - set-control:
      part-id: pot1
      control: position
      value: 0.5
  - set-control:
      part-id: pot2
      control: position
      value: 0.5
  - set-control:
      part-id: pot3
      control: position
      value: 0.5
  - set-control:
      part-id: pot4
      control: position
      value: 0.5
  - write-serial: "stow\nresume\n"
  - wait-serial: 'CMD stow OK az=90 tilt=90'
  - wait-serial: 'CMD resume OK'
  - delay: 100ms
  - write-serial: "track\n"
  - wait-serial: 'CMD track OK az=90 tilt=90 band=100 zero=90,90 parked=0 stowed=0'
  - delay: 5ms
  - set-control:
      part-id: pot2
      control: position
      value: 0.53
  - delay: 1000ms
  - write-serial: "track\n"
  - wait-serial: 'CMD track OK az=90 tilt=90 band=100 zero=90,90 parked=0 stowed=0'
  - delay: 5ms
  - write-serial: "deadband 0\n"
  - wait-serial: 'CMD deadband OK value=0'
  - delay: 5200ms
  - write-serial: "track\n"
  - wait-serial: 'CMD track OK az=180 tilt=180 band=0 zero=90,90 parked=0 stowed=0'
  - delay: 5ms
  - write-serial: "deadband 5000\n"
  - wait-serial: 'CMD deadband FAIL reason=range'
  - delay: 5ms
  - write-serial: "zero 200 90\n"
  - wait-serial: 'CMD zero FAIL reason=range'
  - delay: 5ms
  - write-serial: "deadband 100\n"
  - wait-serial: 'CMD deadband OK value=100'
  - delay: 5ms
  - write-serial: "zero 80 100\n"
  - wait-serial: 'CMD zero OK az=80 tilt=100'
  - delay: 5ms
  - set-control:
      part-id: pot1
      control: position
      value: 0
  - set-control:
      part-id: pot2
      control: position
      value: 0
  - set-control:
      part-id: pot3
      control: position
      value: 0
  - set-control:
      part-id: pot4
      control: position
      value: 0
  - delay: 1480ms
  - write-serial: "track\n"
  - wait-serial: 'CMD track OK az=80 tilt=100 band=100 zero=80,100 parked=1 stowed=0 dark=20'
  - delay: 5ms
